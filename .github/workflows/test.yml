name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Xcode info
        run: |
          xcode-select -p
          xcodebuild -version
          sw_vers

      # Record toolchain fingerprint for the build cache key: the Xcode version
      # (changes invalidate .swiftmodule ABI).
      - name: Compute cache fingerprint
        id: fp
        run: |
          XCODE=$(xcodebuild -version | head -n1 | awk '{print $2}')
          echo "xcode=$XCODE" >> "$GITHUB_OUTPUT"

      # Cache the shared DerivedData so Swift incremental compilation can reuse
      # unchanged .swiftmodule / .o outputs across runs. Key composition:
      #   - runner OS + arch          → CPU/SDK compatibility
      #   - Xcode version             → toolchain ABI
      #   - .github/cache-salt        → manual escape hatch (bump to invalidate)
      #   - source hash               → exact match for incremental no-op runs
      # The restore-key drops the source hash so a same-PR retry restores the
      # most recent compatible cache; Swift decides which files to rebuild.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: macos/build/test-dd
          key: dd-${{ runner.os }}-${{ runner.arch }}-xc${{ steps.fp.outputs.xcode }}-salt${{ hashFiles('.github/cache-salt') }}-src${{ hashFiles('macos/**/*.swift', 'macos/ccterm.xcodeproj/project.pbxproj', 'macos/Config.xcconfig', 'macos/AgentSDK/Package.swift', 'macos/ccterm/Localizable.xcstrings') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ runner.arch }}-xc${{ steps.fp.outputs.xcode }}-salt${{ hashFiles('.github/cache-salt') }}-

      - name: Run unit tests
        # Pin DerivedData to the in-tree path the Cache step keys off. Local
        # runs leave this unset and let xcodebuild use its default location
        # (~/Library/Developer/Xcode/DerivedData/ccterm-<hash>), which gives
        # each worktree its own cache via the project-path hash.
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/macos/build/test-dd
        # Under the job's limit, so a hang still reaches the upload below.
        timeout-minutes: 15
        run: .github/ci-heartbeat.sh make test-unit

      - name: Upload xcresult on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: |
            macos/build/logs/utest-*/result.xcresult
            macos/build/logs/utest-*/raw.log
          if-no-files-found: ignore
          retention-days: 7

  # TranscriptKit is a standalone package: `swift test`, no Xcode project.
  # Its own job rather than a step in `test` so it doesn't queue behind the
  # app build — and so a red result names the package instead of the app.
  test-kit:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      # Package.resolved is gitignored, so the key rides Package.swift (where
      # the dependency pin lives) plus the package's sources.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: macos/TranscriptKit/.build
          key: kit-${{ runner.os }}-${{ runner.arch }}-pkg${{ hashFiles('macos/TranscriptKit/Package.swift') }}-src${{ hashFiles('macos/TranscriptKit/Sources/**/*.swift', 'macos/TranscriptKit/Tests/**/*.swift') }}
          restore-keys: |
            kit-${{ runner.os }}-${{ runner.arch }}-pkg${{ hashFiles('macos/TranscriptKit/Package.swift') }}-

      - name: Run package tests
        run: make test-kit

  test-sdk:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: macos/AgentSDK/.build
          key: sdk-${{ runner.os }}-${{ runner.arch }}-pkg${{ hashFiles('macos/AgentSDK/Package.swift') }}-src${{ hashFiles('macos/AgentSDK/Sources/**/*.swift', 'macos/AgentSDK/Tests/**') }}
          restore-keys: |
            sdk-${{ runner.os }}-${{ runner.arch }}-pkg${{ hashFiles('macos/AgentSDK/Package.swift') }}-

      - name: Run package tests
        run: make test-sdk

  # ExactList: its own package, its own job, same shape as test-kit.
  test-list:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: macos/ExactList/.build
          key: list-${{ runner.os }}-${{ runner.arch }}-pkg${{ hashFiles('macos/ExactList/Package.swift') }}-src${{ hashFiles('macos/ExactList/Sources/**/*.swift', 'macos/ExactList/Tests/**/*.swift') }}
          restore-keys: |
            list-${{ runner.os }}-${{ runner.arch }}-pkg${{ hashFiles('macos/ExactList/Package.swift') }}-

      - name: Run package tests
        run: make test-list

  # Components: the app's components, testable without the app. Same shape.
  test-ui:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: macos/Components/.build
          key: ui-${{ runner.os }}-${{ runner.arch }}-pkg${{ hashFiles('macos/Components/Package.swift') }}-src${{ hashFiles('macos/Components/Sources/**/*.swift', 'macos/Components/Tests/**/*.swift') }}
          restore-keys: |
            ui-${{ runner.os }}-${{ runner.arch }}-pkg${{ hashFiles('macos/Components/Package.swift') }}-

      - name: Run package tests
        run: make test-ui
