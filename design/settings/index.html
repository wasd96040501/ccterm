<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTerm Settings</title>
<style>
/* 1 CSS px = 1 pt. Every size below is measured from a macOS 27 settings
   window at 2× (see README.md), so a 2× screenshot of .window lines up
   pixel for pixel with the real thing. */

:root {
  --page: #e3e4e6;
  --win: #ffffff;
  --sidebar: #eeeff0;
  --label: rgba(0, 0, 0, .85);
  --label-2: rgba(0, 0, 0, .5);
  --label-3: rgba(0, 0, 0, .26);
  --group: rgba(0, 0, 0, .027);
  --sep: rgba(0, 0, 0, .037);
  --fill: rgba(0, 0, 0, .06);
  --fill-press: rgba(0, 0, 0, .12);
  --accent: #3b85f0;
  --accent-text: #1f6fe0;
  --switch-off: rgba(0, 0, 0, .09);
  --glass: rgba(255, 255, 255, .78);
  --glass-edge: rgba(0, 0, 0, .1);
  --menu: rgba(246, 246, 246, .86);
  --shadow: 0 0 0 .5px rgba(0, 0, 0, .18), 0 22px 60px rgba(0, 0, 0, .22), 0 6px 16px rgba(0, 0, 0, .1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #151517; --win: #282828; --sidebar: #303032;
    --label: rgba(255, 255, 255, .86); --label-2: rgba(255, 255, 255, .55); --label-3: rgba(255, 255, 255, .25);
    --group: rgba(255, 255, 255, .042); --sep: rgba(255, 255, 255, .06);
    --fill: rgba(255, 255, 255, .1); --fill-press: rgba(255, 255, 255, .18);
    --accent: #3b85f0; --accent-text: #4c9bff; --switch-off: rgba(255, 255, 255, .14);
    --glass: rgba(60, 60, 62, .72); --glass-edge: rgba(255, 255, 255, .12);
    --menu: rgba(44, 44, 46, .86);
    --shadow: 0 0 0 .5px rgba(0, 0, 0, .8), inset 0 0 0 .5px rgba(255, 255, 255, .12), 0 22px 60px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #151517; --win: #282828; --sidebar: #303032;
  --label: rgba(255, 255, 255, .86); --label-2: rgba(255, 255, 255, .55); --label-3: rgba(255, 255, 255, .25);
  --group: rgba(255, 255, 255, .042); --sep: rgba(255, 255, 255, .06);
  --fill: rgba(255, 255, 255, .1); --fill-press: rgba(255, 255, 255, .18);
  --accent: #3b85f0; --accent-text: #4c9bff; --switch-off: rgba(255, 255, 255, .14);
  --glass: rgba(60, 60, 62, .72); --glass-edge: rgba(255, 255, 255, .12);
  --menu: rgba(44, 44, 46, .86);
  --shadow: 0 0 0 .5px rgba(0, 0, 0, .8), inset 0 0 0 .5px rgba(255, 255, 255, .12), 0 22px 60px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); }
body {
  font: 13px/16px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: var(--label);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 24px 16px 48px;
  cursor: default;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: default; }
input { font: inherit; color: inherit; }
svg { display: block; }

/* ---------- Review bar (outside the window) ---------- */
.review {
  width: 880px; max-width: 100%;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-bottom: 20px; color: var(--label-2); font-size: 12px;
}
.review b { color: var(--label); font-weight: 600; font-size: 13px; }
.review .spacer { flex: 1; }
.review .btn { color: var(--label); }
.review label { display: flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 7px; padding: 2px; }
.seg button { padding: 2px 10px; border-radius: 5px; font-size: 12px; color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--win); box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.12); }

/* ---------- Window ---------- */
.stage { flex: none; }
.window {
  position: relative;
  width: 880px; height: 680px;
  border-radius: 15px;
  background: var(--win);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  isolation: isolate;
}

/* Sidebar: full height, 180 wide. Rows 32 tall, inset 10, first row at y 52. */
.sidebar { width: 180px; flex: none; background: var(--sidebar); position: relative; padding-top: 52px; }
.traffic { position: absolute; top: 19px; left: 19px; display: flex; gap: 9px; }
.traffic i { width: 14px; height: 14px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
.traffic i:nth-child(1) { background: #ff5f57; }
.traffic i:nth-child(2) { background: #febc2e; }
.traffic i:nth-child(3) { background: #28c840; }
.window.inactive .traffic i { background: var(--label-3); box-shadow: none; }
.nav { list-style: none; margin: 0; padding: 0 10px; }
.nav button {
  width: 160px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; gap: 0;
  padding-left: 10px; color: var(--label);
}
.nav .glyph { width: 18px; height: 18px; margin-right: 9px; color: var(--accent); flex: none; }
.nav button[aria-selected="true"] { background: var(--accent); color: #fff; }
.nav button[aria-selected="true"] .glyph { color: #fff; }
.window.inactive .nav button[aria-selected="true"] { background: var(--fill-press); color: var(--label); }
.window.inactive .nav button[aria-selected="true"] .glyph { color: var(--accent); }

/* Detail: toolbar floats over the scrolling form. */
.detail { flex: 1; position: relative; min-width: 0; }
.toolbar {
  position: absolute; inset: 0 0 auto 0; height: 52px; z-index: 5;
  display: flex; align-items: center; padding-left: 8px;
  background: linear-gradient(var(--win) 55%, color-mix(in srgb, var(--win) 0%, transparent));
  pointer-events: none;
}
.toolbar > * { pointer-events: auto; }
.history {
  width: 73px; height: 36px; border-radius: 18px;
  display: flex; align-items: center;
  background: var(--glass);
  box-shadow: 0 0 0 .5px var(--glass-edge), 0 1px 3px rgba(0,0,0,.06);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.history button { width: 36px; height: 36px; display: grid; place-items: center; color: var(--label); }
.history button:disabled { color: var(--label-3); }
.history .div { width: 1px; height: 18px; background: var(--sep); background: var(--glass-edge); }
.toolbar h1 { margin: 0 0 0 13px; font-size: 15px; line-height: 20px; font-weight: 600; }

.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 0 20px 20px; }
.pane { display: none; padding-top: 52px; }
.pane.active { display: block; }

/* ---------- Grouped form ---------- */
/* Header baseline sits 13.5 above its group; group-to-group pitch is 56. */
.section { margin-top: 30px; }
.section:first-child { margin-top: 20px; }
.section > h2 {
  margin: 0; padding: 0 10px 10px; font-size: 13px; line-height: 16px; font-weight: 600;
  display: flex; align-items: flex-end; justify-content: space-between;
}
.group { background: var(--group); border-radius: 12px; }
/* The trailing control shares the title's line; the description runs
   underneath it, stopping 62 short of the row's right edge. */
.row {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px;
  align-items: center; min-height: 37px; padding: 10.5px 10px;
}
.row + .row::before {
  content: ""; position: absolute; top: -1px; left: 10px; right: 10px; height: 1px; background: var(--sep);
}
.row + .row { margin-top: 1px; }
.row .title { grid-column: 1; line-height: 16px; min-width: 0; }
.row .desc { grid-column: 1 / -1; font-size: 11px; line-height: 14px; color: var(--label-2); padding-right: 62px; margin-top: 1px; }
.row:has(.popup) .desc { margin-top: 3.5px; }
.row .trail { grid-column: 2; grid-row: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; height: 16px; }
.section > .foot { font-size: 11px; line-height: 14px; color: var(--label-2); padding: 6px 10px 0; }
.section > .after { display: flex; justify-content: flex-end; gap: 8px; padding-top: 10px; }

/* Popup button: value, 12 gap, 20pt indicator circle. */
.popup { display: inline-flex; align-items: center; gap: 12px; height: 20px; margin: -2px 2px -2px 0; color: var(--label); }
.popup .ind { width: 20px; height: 20px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; }
.popup:active .ind, .popup[aria-expanded="true"] .ind { background: var(--fill-press); }

/* Switch: 36×16 track, 21×13 pill knob inset 1.5. */
.switch { position: relative; width: 36px; height: 16px; border-radius: 8px; background: var(--switch-off); flex: none; transition: background .2s; }
.switch::after {
  content: ""; position: absolute; top: 1.5px; left: 1.5px; width: 21px; height: 13px; border-radius: 6.5px;
  background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.18);
  transition: transform .22s cubic-bezier(.3,.7,.3,1.2);
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(12px); }
.switch:active::after { width: 24px; }
.switch[aria-checked="true"]:active::after { transform: translateX(9px); }

/* Push button: 24 tall, flat fill, 6 radius. */
.btn {
  height: 24px; padding: 0 12px; border-radius: 6px; background: var(--fill);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; min-width: 64px;
}
.btn:active { background: var(--fill-press); }
.btn.default { background: var(--accent); color: #fff; }
.btn.default:active { filter: brightness(.9); }
.btn.default:disabled { background: var(--fill); color: var(--label-3); }
.btn:disabled { color: var(--label-3); }
.btn.destructive { color: #e5484d; }
.btn.small { height: 20px; padding: 0 9px; font-size: 12px; border-radius: 5px; min-width: 0; }
.btn.icon { min-width: 0; padding: 0; width: 24px; }

/* Plain in-row text field: right-aligned, borderless, like a grouped Form. */
.field {
  border: 0; outline: 0; background: none; text-align: right; padding: 0; margin: 0;
  width: 260px; height: 16px; line-height: 16px; color: var(--label); caret-color: var(--accent);
  -webkit-user-select: text; user-select: text;
}
.field::placeholder { color: var(--label-3); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .92em; }

/* ---------- Menu (NSMenu look) ---------- */
.menu {
  position: absolute; z-index: 50; min-width: 180px; padding: 5px;
  background: var(--menu); border-radius: 10px;
  -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 10px 30px rgba(0,0,0,.2);
  animation: menu-in .12s ease-out;
}
@keyframes menu-in { from { opacity: 0; } }
.menu .item {
  display: flex; align-items: center; width: 100%; height: 22px; padding: 0 10px 0 22px; border-radius: 5px;
  position: relative; white-space: nowrap; color: var(--label);
}
.menu .item .check { position: absolute; left: 7px; top: 5px; }
.menu .item .sub { color: var(--label-2); margin-left: 8px; }
.menu .item .key { margin-left: auto; padding-left: 24px; color: var(--label-2); }
.menu .item.hl { background: var(--accent); color: #fff; }
.menu .item.hl .sub, .menu .item.hl .key { color: rgba(255,255,255,.75); }
.menu .item:disabled { color: var(--label-3); }
.menu .item.danger { color: #e5484d; }
.menu .sep { height: 1px; margin: 5px 10px; background: var(--sep); background: color-mix(in srgb, var(--label) 12%, transparent); }
.menu .head { padding: 3px 10px 2px 22px; font-size: 11px; color: var(--label-2); font-weight: 600; }
.catcher { position: absolute; inset: 0; z-index: 49; }

/* ---------- Account rows ---------- */
/* Same 52 as a title + description row. Only the subscription carries a
   mark (Claude's own, 28 in front); providers are plain text rows. */
.acct {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px;
  align-items: center; min-height: 51px; padding: 10.5px 10px;
}
.acct.has-mark { grid-template-columns: 28px minmax(0, 1fr) auto; }
.acct + .acct::before, .row + .acct::before, .acct + .row::before {
  content: ""; position: absolute; top: -1px; left: 10px; right: 10px; height: 1px; background: var(--sep);
}
.acct + .acct, .row + .acct, .acct + .row { margin-top: 1px; }
.acct .name { line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct .meta { font-size: 11px; line-height: 14px; color: var(--label-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct .meta .dot { margin: 0 4px; }
.acct .trail { display: flex; align-items: center; gap: 10px; }
/* assets/claude.svg is claude.ai's favicon, unmodified. */
.mark { width: 28px; height: 28px; display: block; }
.mark.off { filter: grayscale(1); opacity: .45; }
/* An NSAlert shows the app's icon. */
.appicon { width: 64px; height: 64px; display: block; margin: -4px auto 8px; }
.info { width: 20px; height: 20px; display: grid; place-items: center; color: var(--label-2); border-radius: 50%; }
.info:active { color: var(--label); }
.acct.pressed { background: color-mix(in srgb, var(--label) 5%, transparent); }
.group > .acct:first-child.pressed { border-radius: 12px 12px 0 0; }
.group > .acct:last-child.pressed { border-radius: 0 0 12px 12px; }
.group > .acct:only-child.pressed { border-radius: 12px; }
.empty { padding: 18px 10px; text-align: center; color: var(--label-2); }
.empty .t { color: var(--label); margin-bottom: 2px; }

/* ---------- Sheets ---------- */
/* Tahoe sheets float 14 below the window top, centred, over a faint scrim. */
.layer { position: absolute; inset: 0; z-index: 40; display: flex; justify-content: center; align-items: flex-start; }
.layer.scrim { background: rgba(0, 0, 0, .06); animation: fade .2s ease-out; }
.layer.closing { animation: fade .18s ease-in reverse forwards; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: relative; margin-top: 14px; border-radius: 18px; background: var(--win);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.16), 0 18px 50px rgba(0,0,0,.22), 0 4px 12px rgba(0,0,0,.08);
  display: flex; flex-direction: column; overflow: hidden;
  animation: sheet-in .32s cubic-bezier(.2, .9, .25, 1);
}
.layer.closing .sheet { animation: sheet-out .18s ease-in forwards; }
@keyframes sheet-in { from { transform: translateY(-18px) scale(.985); opacity: 0; } }
@keyframes sheet-out { to { transform: translateY(-12px) scale(.985); opacity: 0; } }
:root[data-theme="dark"] .sheet { box-shadow: 0 0 0 .5px rgba(0,0,0,.8), inset 0 0 0 .5px rgba(255,255,255,.12), 0 18px 50px rgba(0,0,0,.5); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sheet { box-shadow: 0 0 0 .5px rgba(0,0,0,.8), inset 0 0 0 .5px rgba(255,255,255,.12), 0 18px 50px rgba(0,0,0,.5); } }
.sheet.fixed { width: 540px; height: 600px; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 20px 20px 4px; flex: none; }
.sheet-head .mark { width: 36px; height: 36px; }
.sheet-head .t { font-weight: 600; }
.sheet-head .s { font-size: 11px; line-height: 14px; color: var(--label-2); }
.sheet-body { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
.sheet-body .section:first-child { margin-top: 16px; }
.sheet-body .section { margin-top: 22px; }
.sheet-foot { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 20px 20px; position: relative; }
.sheet-foot.edge::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--sep); }
.sheet-foot .spacer { flex: 1; }
.sheet-foot .btn { min-width: 76px; }

/* Secure field: masked with its last four, eye to reveal. */
.secret { display: flex; align-items: center; gap: 6px; }
.secret .field { width: 230px; }
.eye { width: 20px; height: 20px; display: grid; place-items: center; color: var(--label-2); border-radius: 5px; }
.eye:active { color: var(--label); }
.row .desc.error { color: #e5484d; }
.row .desc code, .foot code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .92em; }

/* Environment list: lives inside a group, +/− underneath like System Settings lists. */
.env { outline: none; }
.env .thead, .env .tr { display: grid; grid-template-columns: 30px minmax(0, 1.6fr) minmax(0, 1fr) 22px; align-items: center; }
.env .thead { height: 28px; font-size: 11px; color: var(--label-2); padding: 0 10px 0 0; border-bottom: 1px solid var(--sep); }
.env .thead span:nth-child(2), .env .thead span:nth-child(3) { padding-left: 6px; }
.env .tbody { height: 128px; overflow-y: auto; padding: 4px 5px; }
.env .tr { height: 24px; border-radius: 6px; padding-right: 5px; }
.env .tr .cell { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 24px; }
.env .tr.off .cell { color: var(--label-3); }
.env .tr .cell.placeholder { color: var(--label-3); font-family: inherit; font-size: 13px; }
.env .tr.sel { background: var(--fill-press); }
.env:focus-within .tr.sel, .env:focus .tr.sel { background: var(--accent); }
.env:focus .tr.sel .cell, .env:focus-within .tr.sel:not(.editing) .cell { color: #fff; }
.env:focus .tr.sel .warn, .env:focus-within .tr.sel .warn { color: #fff; }
.env .tr.editing { background: transparent !important; }
.env .tr input.cell {
  width: calc(100% - 4px); margin: 0 2px; height: 20px; line-height: 20px; padding: 0 4px; border: 0; outline: 0; border-radius: 4px;
  background: var(--win); color: var(--label); box-shadow: 0 0 0 1px var(--accent), 0 0 0 3.5px color-mix(in srgb, var(--accent) 35%, transparent);
  -webkit-user-select: text; user-select: text;
}
.env .warn { color: #d99100; display: grid; place-items: center; }
.env .empty-list { height: 100%; display: grid; place-items: center; color: var(--label-3); text-align: center; line-height: 18px; }
.listbar { display: flex; align-items: center; height: 28px; border-top: 1px solid var(--sep); padding: 0 6px; gap: 2px; }
.listbar button { width: 22px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--label); }
.listbar button:disabled { color: var(--label-3); }
.listbar button:active:not(:disabled) { background: var(--fill-press); }
.listbar .hint { margin-left: auto; padding-right: 4px; font-size: 11px; color: var(--label-2); }
.cb {
  width: 14px; height: 14px; border-radius: 4px; margin: 0 auto; display: grid; place-items: center;
  background: var(--win); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--label) 22%, transparent); color: #fff;
}
.cb[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.cb svg { width: 9px; height: 10px; }
.cb[aria-checked="false"] svg { display: none; }
.env:focus .tr.sel .cb[aria-checked="true"], .env:focus-within .tr.sel .cb[aria-checked="true"] { background: #fff; color: var(--accent); }

/* Toast inside a sheet: says what a paste just did. */
.toast {
  position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 3;
  padding: 6px 12px; border-radius: 14px; font-size: 12px; white-space: nowrap;
  background: color-mix(in srgb, var(--label) 88%, transparent); color: var(--win);
  animation: toast 2.8s ease forwards;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 6px); } 8%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* Alert (NSAlert on a sheet): 260 wide, centred text, side-by-side buttons. */
.alert { width: 260px; margin-top: 90px; padding: 20px 16px 16px; text-align: center; }
.alert .t { font-weight: 600; margin-bottom: 6px; }
.alert .m { font-size: 11px; line-height: 14px; color: var(--label); margin-bottom: 16px; }
.alert .btns { display: flex; gap: 8px; }
.alert .btns .btn { flex: 1; min-width: 0; height: 28px; border-radius: 14px; }

/* Sign-in wait */
.signin { width: 380px; padding: 24px 24px 20px; text-align: center; }
.signin .mark { width: 48px; height: 48px; margin: 0 auto 14px; }
.signin .t { font-weight: 600; font-size: 15px; line-height: 20px; margin-bottom: 4px; }
.signin .m { color: var(--label-2); font-size: 12px; line-height: 16px; margin-bottom: 18px; }
.signin .wait { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--label-2); font-size: 12px; margin-bottom: 20px; }
.signin .btns { display: flex; justify-content: space-between; }
.spin { width: 14px; height: 14px; animation: spin 1s steps(8) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.link { color: var(--accent-text); }
.link:active { opacity: .7; }
</style>
</head>
<body>

<div class="review" role="toolbar" aria-label="Review controls">
  <b>CCTerm Settings</b>
  <span>Design review · 1 CSS px = 1 pt</span>
  <span class="spacer"></span>
  <button class="btn small" id="copy-alias" title="Then open a provider, click its variable list and press ⌘V">Copy Sample Alias</button>
  <label>Appearance
    <span class="seg" id="theme">
      <button data-v="auto" aria-pressed="true">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
    </span>
  </label>
</div>

<div class="stage">
  <div class="window" id="win">
    <aside class="sidebar">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <ul class="nav" role="tablist" id="nav"></ul>
    </aside>
    <section class="detail">

/* ---------- State ---------- */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

/* ---------- Sidebar + history ---------- */
function renderNav() {
  $('#nav').innerHTML = TABS.map(t => `
    <li><button role="tab" data-tab="${t.id}" aria-selected="${t.id === state.tab}">
      <span class="glyph">${t.glyph}</span>${t.title}</button></li>`).join('')
  $('#title').textContent = TABS.find(t => t.id === state.tab).title
  for (const t of TABS) $('#pane-' + t.id).classList.toggle('active', t.id === state.tab)
  $('#back').disabled = !state.back.length
  $('#fwd').disabled = !state.fwd.length
}
function go(tab, how = 'push') {
  if (tab === state.tab) return
  if (how === 'push') { state.back.push(state.tab); state.fwd = [] }
  state.tab = tab
  $('#scroll').scrollTop = 0
  renderNav()
}
$('#nav').addEventListener('mousedown', e => {
  const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab)
})
$('#back').onclick = () => { const t = state.back.pop(); state.fwd.push(state.tab); go(t, 'none') }
$('#fwd').onclick = () => { const t = state.fwd.pop(); state.back.push(state.tab); go(t, 'none') }

/* ---------- Menus ---------- */
// items: [{label, sub, key, checked, disabled, danger, action}] | 'sep' | {head}
function openMenu(anchor, items, { align = 'selected', onClose } = {}) {
  closeMenu()
  const win = $('#win'), wr = win.getBoundingClientRect(), ar = anchor.getBoundingClientRect()
  const catcher = document.createElement('div'); catcher.className = 'catcher'
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu')
  m.innerHTML = items.map((it, i) => it === 'sep' ? '<div class="sep"></div>'
    : it.head ? `<div class="head">${esc(it.head)}</div>`
    : `<button class="item${it.danger ? ' danger' : ''}" role="menuitem" data-i="${i}" ${it.disabled ? 'disabled' : ''}>
        ${it.checked ? `<span class="check">${G.check}</span>` : ''}${esc(it.label)}${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}${it.key ? `<span class="key">${esc(it.key)}</span>` : ''}</button>`).join('')
  win.append(catcher, m)
  const mw = m.offsetWidth, mh = m.offsetHeight
  let left, top
  if (align === 'selected') {
    // NSPopUpButton: the checked item sits right over the button's title.
    const sel = m.querySelector('.check')?.parentElement || m.querySelector('.item')
    const title = anchor.querySelector('.val') || anchor
    const tr = title.getBoundingClientRect()
    left = tr.left - wr.left - 22
    top = tr.top - wr.top - sel.offsetTop - 3
    left = Math.min(left, ar.right - wr.left - mw + 8)
  } else {
    left = ar.left - wr.left; top = ar.bottom - wr.top + 4
  }
  left = Math.max(8, Math.min(left, wr.width - mw - 8))
  top = Math.max(8, Math.min(top, wr.height - mh - 8))
  Object.assign(m.style, { left: left + 'px', top: top + 'px' })
  anchor.setAttribute('aria-expanded', 'true')
  const close = () => { catcher.remove(); m.remove(); anchor.removeAttribute('aria-expanded'); openMenu.close = null; onClose?.() }
  openMenu.close = close
  catcher.addEventListener('mousedown', close)
  // A quick click leaves the menu open; press-drag-release picks, as in AppKit.
  const openedAt = performance.now()
  m.addEventListener('mouseup', e => {
    if (performance.now() - openedAt < 300) return
    const b = e.target.closest('.item'); if (!b || b.disabled) return
    close(); items[+b.dataset.i].action?.()
  })
}
function closeMenu() { openMenu.close?.() }
// Highlight follows the pointer and the arrow keys; Return or Space picks.
document.addEventListener('mouseover', e => {
  const m = $('.menu'); if (!m) return
  const it = e.target.closest('.menu .item')
  m.querySelectorAll('.hl').forEach(x => x !== it && x.classList.remove('hl'))
  if (it && !it.disabled) it.classList.add('hl')
})
document.addEventListener('keydown', e => {
  if (!openMenu.close) return
  const m = $('.menu'), items = [...m.querySelectorAll('.item:not(:disabled)')]
  const cur = items.indexOf(m.querySelector('.hl'))
  e.stopImmediatePropagation()
  if (e.key === 'Escape') { e.preventDefault(); closeMenu() }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault()
    const n = e.key === 'ArrowDown' ? (cur + 1) % items.length : (cur <= 0 ? items.length - 1 : cur - 1)
    items.forEach((x, i) => x.classList.toggle('hl', i === n))
  } else if ((e.key === 'Enter' || e.key === ' ') && cur >= 0) {
    e.preventDefault()
    items[cur].dispatchEvent(new MouseEvent('mouseup', { bubbles: true }))
  }
}, true)

/* ---------- Primitives ---------- */
const row = ({ title, desc = '', trail = '', attrs = '' }) => `

// Row interactions: ⓘ or double-click opens details; right-click for the rest.
const pane = $('#pane-accounts')
pane.addEventListener('click', e => {
  const i = e.target.closest('[data-info]'); if (i) return openAccount(i.dataset.info)

  ]

  else items.push('sep', { label: 'Sign Out…', action: () => confirmSignOut() })

function duplicate(id) {
  const a = state.accounts.find(x => x.id === id)
  const copy = structuredClone(a); copy.id = 'p' + Date.now(); copy.name = a.name + ' Copy'
  state.accounts.splice(state.accounts.indexOf(a) + 1, 0, copy)

/* ---------- Sheet stack ---------- */
// Each sheet: { el, onKey(e) → handled? }. Alerts stack on top of sheets.
const sheets = []
function presentSheet(html, { cls = '', onKey, scrim = true } = {}) {
  closeMenu()
  const layer = document.createElement('div')
  layer.className = 'layer' + (scrim && !sheets.length ? ' scrim' : '')
  layer.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`
  $('#win').append(layer)
  const s = { layer, el: layer.firstElementChild, onKey }
  sheets.push(s)
  return s
}
function dismissSheet(s = sheets.at(-1)) {
  if (!s) return
  sheets.splice(sheets.indexOf(s), 1)
  s.layer.classList.add('closing')
  setTimeout(() => s.layer.remove(), 190)
}
document.addEventListener('keydown', e => {
  const s = sheets.at(-1); if (!s || openMenu.close) return
  if (s.onKey?.(e)) return
  if (e.key === 'Escape' || (e.metaKey && e.key === '.')) { e.preventDefault(); s.el.querySelector('[data-role="cancel"]')?.click() }
  else if (e.key === 'Enter' && !e.isComposing) {
    const d = s.el.querySelector('.btn.default'); if (d && !d.disabled) { e.preventDefault(); d.click() }
  }
})

const SECRET_KEY = /KEY|TOKEN|SECRET|PASSWORD/i
const mask = v => !v ? '' : v.length <= 8 ? '•'.repeat(v.length) : v.slice(0, 3) + '••••••••' + v.slice(-4)

const MANAGED = {

function editAccount(d, isNew) {

    ? `${MARK}<div><div class="t">${esc(d.email)}</div><div class="s">Claude ${esc(d.plan)} subscription</div></div>`

    const keyName = d.auth === 'key' ? 'ANTHROPIC_API_KEY' : 'ANTHROPIC_AUTH_TOKEN'
    const first = isSub ? `

        ${row({ title: 'Organization', trail: `<span style="color:var(--label-2)">${esc(d.org)}</span>` })}

        ${row({ title: 'Signed in with', trail: `<span style="color:var(--label-2)">${esc(d.method)}</span>` })}
      </div></div>`
    : `
      <div class="section"><h2>Connection</h2><div class="group">
        ${row({ title: 'Name', trail: `<input class="field" data-f="name" placeholder="Required" value="${esc(d.name)}" spellcheck="false">` })}
        ${row({ title: 'Base URL', desc: urlBad ? 'Enter a URL that starts with http:// or https://.' : '',
          trail: `<input class="field" data-f="baseURL" placeholder="https://api.anthropic.com" value="${esc(d.baseURL)}" spellcheck="false">` })}
        ${row({ title: 'Authentication', trail: popup('auth', d.auth === 'key' ? 'API Key' : 'Auth Token') })}
        ${row({ title: d.auth === 'key' ? 'API key' : 'Token', desc: `Sent as <code>${keyName}</code>. Stored in your keychain.`,
          trail: `<span class="secret"><input class="field mono" data-f="secret" placeholder="Required" spellcheck="false" autocomplete="off"
            type="${reveal || focused === 'secret' ? (reveal ? 'text' : 'password') : 'text'}" value="${esc(reveal || focused === 'secret' ? d.secret : mask(d.secret))}">
            <button class="eye" data-role="reveal" aria-label="${reveal ? 'Hide' : 'Show'}">${reveal ? G.eyeOff : G.eye}</button></span>` })}
      </div></div>`
    const models = isSub ? '' : `

        ${row({ title: 'Model', trail: `<input class="field mono" data-f="model" placeholder="Default" value="${esc(d.model)}" spellcheck="false">` })}
        ${row({ title: 'Opus', trail: `<input class="field mono" data-f="opus" placeholder="Default" value="${esc(d.opus)}" spellcheck="false">` })}
        ${row({ title: 'Sonnet', trail: `<input class="field mono" data-f="sonnet" placeholder="Default" value="${esc(d.sonnet)}" spellcheck="false">` })}
        ${row({ title: 'Haiku', trail: `<input class="field mono" data-f="haiku" placeholder="Default" value="${esc(d.haiku)}" spellcheck="false">` })}
      </div></div>`
    body.innerHTML = first + `
      <div class="section"><h2>Environment Variables</h2><div class="group env" tabindex="0">
        <div class="thead"><span></span><span>Name</span><span>Value</span><span></span></div>
        <div class="tbody">${envRows()}</div>
        <div class="listbar">
          <button data-role="add" aria-label="Add variable">${G.plus}</button>
          <button data-role="remove" aria-label="Remove variable" ${sel < 0 ? 'disabled' : ''}>${G.minus}</button>
          <span class="hint">Paste <code>KEY=value</code> lines or a whole shell command</span>
        </div>
      </div></div>
` + models + `
      <div class="section"><h2>Launch</h2><div class="group">
        ${row({ title: 'Command', trail: `<input class="field mono" data-f="command" placeholder="claude" value="${esc(d.command)}" spellcheck="false" style="width:300px">` })}
        ${row({ title: 'Arguments', trail: `<input class="field mono" data-f="args" placeholder="None" value="${esc(d.args)}" spellcheck="false" style="width:300px">` })}
      </div></div>`
    body.scrollTop = top
    validate()
    edge()
  }
  function envRows() {
    if (!d.env.length) return `<div class="empty-list">No Variables<br><span style="font-size:11px">Click + or paste to add.</span></div>`
    const dupes = new Set(d.env.map(v => v.key).filter((k, i, a) => k && a.indexOf(k) !== i))
    return d.env.map((v, i) => {
      const warn = MANAGED[v.key] ? `Overrides the ${MANAGED[v.key]} field.` : dupes.has(v.key) ? 'Defined more than once; the last one wins.' : ''
      const cell = (f, text, ph) => editing?.i === i && editing.f === f
        ? `<input class="cell" data-cell="${f}" value="${esc(v[f])}" spellcheck="false" autocomplete="off">`
        : `<span class="cell${text ? '' : ' placeholder'}" data-cell="${f}">${text ? esc(text) : ph}</span>`
      return `<div class="tr${i === sel ? ' sel' : ''}${v.on ? '' : ' off'}${editing?.i === i ? ' editing' : ''}" data-i="${i}">
        <span class="cb" role="checkbox" aria-checked="${v.on}">${G.check}</span>
        ${cell('key', v.key, 'Name')}
        ${cell('value', SECRET_KEY.test(v.key) && !(editing?.i === i) ? mask(v.value) : v.value, 'Value')}
        <span class="warn" title="${esc(warn)}">${warn ? G.warn : ''}</span></div>`
    }).join('')
  }
  function renderEnv() {
    body.querySelector('.tbody').innerHTML = envRows()
    body.querySelector('[data-role="remove"]').disabled = sel < 0
    const inp = body.querySelector('input.cell')
    if (inp) { inp.focus(); inp.select() }
    else if (document.activeElement === document.body || !body.contains(document.activeElement)) body.querySelector('.env').focus()
    body.querySelector('.tr.sel')?.scrollIntoView({ block: 'nearest' })
    validate()
  }
  function validate() {
    const ok = isSub || (d.name.trim() && validURL(d.baseURL) && d.secret)
    el.querySelector('[data-role="save"]').disabled = !ok
  }
  function edge() { el.querySelector('.sheet-foot').classList.toggle('edge', body.scrollHeight - body.scrollTop - body.clientHeight > 1) }
  body.addEventListener('scroll', edge)

  // Env list: click selects; click on a selected cell or double-click edits.
  function commitEdit(move) {
    if (!editing) return
    const inp = body.querySelector('input.cell')
    const v = d.env[editing.i]
    if (inp) v[editing.f] = editing.f === 'key' ? inp.value.trim().toUpperCase().replace(/\s+/g, '_') : inp.value
    const was = editing; editing = null
    if (!v.key && !v.value) { d.env.splice(was.i, 1); sel = Math.min(sel, d.env.length - 1) }
    else if (move === 'next' && was.f === 'key') editing = { i: was.i, f: 'value' }
    renderEnv()
  }
  function cancelEdit() {
    const v = d.env[editing.i], i = editing.i
    editing = null
    if (!v.key && !v.value) { d.env.splice(i, 1); sel = Math.min(sel, d.env.length - 1) }
    renderEnv()
  }
  function addVar() {
    commitEdit()
    d.env.push({ on: true, key: '', value: '' })
    sel = d.env.length - 1; editing = { i: sel, f: 'key' }
    renderEnv()
  }
  function removeVar() {
    if (sel < 0) return
    d.env.splice(sel, 1); sel = Math.min(sel, d.env.length - 1); editing = null
    renderEnv()
  }

  body.addEventListener('mousedown', e => {
    const tr = e.target.closest('.tr')
    if (!tr) {
      if (editing && !e.target.closest('input.cell')) commitEdit()
      return
    }
    if (e.target.closest('input.cell')) return
    e.preventDefault()
    const i = +tr.dataset.i
    if (e.target.closest('.cb')) { d.env[i].on = !d.env[i].on; sel = i; renderEnv(); return }
    const cell = e.target.closest('[data-cell]')?.dataset.cell
    if (editing) commitEdit()
    if (i === sel && cell && e.detail === 1) {
      // Second click on a selected row edits, after a beat, as NSTableView does.
      clearTimeout(editAccount.t)
      editAccount.t = setTimeout(() => { if (sel === i && !editing) { editing = { i, f: cell }; renderEnv() } }, 280)
    }
    sel = i
    renderEnv()
    body.querySelector('.env').focus()
  })
  body.addEventListener('dblclick', e => {
    const tr = e.target.closest('.tr'), cell = e.target.closest('[data-cell]')?.dataset.cell
    if (!tr || !cell || e.target.closest('input')) return
    clearTimeout(editAccount.t)
    sel = +tr.dataset.i; editing = { i: sel, f: cell }; renderEnv()
  })
  body.addEventListener('paste', e => {
    if (e.target.closest('input')) return
    const text = e.clipboardData.getData('text'); if (!text.trim()) return
    e.preventDefault()
    applyPaste(text)
  })

  // Pastes: KEY=value lines, `export KEY=value`, or a whole alias / command line.
  function applyPaste(text) {
    const alias = text.match(/^\s*alias\s+([\w-]+)=(["'])([\s\S]*)\2\s*$/)
    const src = alias ? alias[3] : text
    const re = /(?:^|\s)(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=("([^"]*)"|'([^']*)'|(\S*))/g
    const vars = []; let m, lastEnd = 0
    while ((m = re.exec(src))) { vars.push([m[1], m[3] ?? m[4] ?? m[5] ?? '']); lastEnd = re.lastIndex }
    if (!vars.length) return toast('Nothing to paste — expected KEY=value')
    const rest = src.slice(lastEnd).trim()
    const filled = []
    for (const [k, v] of vars) {
      if (!isSub && k === 'ANTHROPIC_BASE_URL') { d.baseURL = v; filled.push('Base URL') }
      else if (!isSub && (k === 'ANTHROPIC_AUTH_TOKEN' || k === 'ANTHROPIC_API_KEY')) { d.secret = v; d.auth = k.endsWith('KEY') ? 'key' : 'token'; filled.push(k.endsWith('KEY') ? 'API key' : 'token') }
      else if (!isSub && k === 'ANTHROPIC_MODEL') { d.model = v; filled.push('model') }
      else if (!isSub && /^ANTHROPIC_DEFAULT_(OPUS|SONNET|HAIKU)_MODEL$/.test(k)) { d[k.split('_')[2].toLowerCase()] = v; filled.push(k.split('_')[2][0] + k.split('_')[2].slice(1).toLowerCase()) }
      else {
        const ex = d.env.find(x => x.key === k)
        if (ex) ex.value = v; else d.env.push({ on: true, key: k, value: v })
        filled.push('var')
      }
    }
    // What follows the variables is the command: `claude` stays the default.
    const cmd = rest.match(/^(\S+)\s*(.*)$/)
    if (cmd) {
      if (cmd[1] !== 'claude') { d.command = cmd[1]; filled.push('command') }
      if (cmd[2]) { d.args = cmd[2]; filled.push('arguments') }
    }
    if (!isSub && !d.name.trim()) {
      if (alias) { d.name = alias[1]; filled.push('name') }
      else if (d.baseURL) d.name = hostOf(d.baseURL).replace(/:\d+$/, '').replace(/^127\.0\.0\.1$|^localhost$/, 'Local Proxy')
    }
    const nVars = filled.filter(x => x === 'var').length
    const fields = [...new Set(filled.filter(x => x !== 'var'))]
    sel = -1; editing = null
    render()
    toast([fields.length && 'Filled ' + fields.join(', '), nVars && `${nVars} variable${nVars > 1 ? 's' : ''}`].filter(Boolean).join(' and '))
  }
  function toast(msg) {
    el.querySelector('.toast')?.remove()
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg
    el.append(t); setTimeout(() => t.remove(), 2900)
  }

  // Fields
  body.addEventListener('input', e => {
    const f = e.target.dataset.f; if (!f) return
    d[f] = e.target.value
    if (f === 'name') el.querySelector('.sheet-head').innerHTML = head()
    if (f === 'baseURL') {
      const bad = d.baseURL && !validURL(d.baseURL), r = e.target.closest('.row')
      let desc = r.querySelector('.desc')
      if (bad && !desc) { desc = document.createElement('div'); desc.className = 'desc error'; r.append(desc) }
      if (desc) { if (bad) desc.textContent = 'Enter a URL that starts with http:// or https://.'; else desc.remove() }
      desc?.classList.add('error')
    }
    validate()
  })
  body.addEventListener('focusin', e => {
    if (e.target.dataset.f === 'secret' && !reveal) { focused = 'secret'; e.target.type = 'password'; e.target.value = d.secret; e.target.select() }
  })
  body.addEventListener('focusout', e => {
    if (e.target.dataset.f === 'secret' && !reveal) { focused = null; e.target.type = 'text'; e.target.value = mask(d.secret) }
    // Re-rendering removes the focused cell too; only a real blur ends the edit.
    if (e.target.matches('input.cell')) setTimeout(() => { if (editing && !body.querySelector('input.cell:focus')) commitEdit() })
  })
  body.addEventListener('click', e => {
    const r = e.target.closest('[data-role]')?.dataset.role
    if (r === 'reveal') { reveal = !reveal; render() }
    if (r === 'add') addVar()
    if (r === 'remove') removeVar()
    if (r === 'manage') toast('Opens claude.ai in your browser')
  })
  body.addEventListener('mousedown', e => {
    const p = e.target.closest('[data-popup="auth"]'); if (!p) return
    e.preventDefault(); e.stopPropagation()
    openMenu(p, [
      { label: 'Auth Token', sub: 'Authorization: Bearer', checked: d.auth === 'token', action: () => { d.auth = 'token'; render() } },
      { label: 'API Key', sub: 'x-api-key', checked: d.auth === 'key', action: () => { d.auth = 'key'; render() } },
    ])
  }, true)

  function onKey(e) {
    if (editing) {
      if (e.key === 'Enter') { e.preventDefault(); commitEdit(); body.querySelector('.env').focus(); return true }
      if (e.key === 'Tab') { e.preventDefault(); commitEdit('next'); return true }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); body.querySelector('.env').focus(); return true }
      return true
    }
    if (document.activeElement === body.querySelector('.env')) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); if (!d.env.length) return true
        sel = Math.max(0, Math.min(d.env.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1))); renderEnv(); return true
      }
      if ((e.key === 'Backspace' || e.key === 'Delete') && sel >= 0) { e.preventDefault(); removeVar(); return true }
      if (e.key === 'Enter' && sel >= 0) { e.preventDefault(); editing = { i: sel, f: 'value' }; renderEnv(); return true }
      if (e.key === ' ' && sel >= 0) { e.preventDefault(); d.env[sel].on = !d.env[sel].on; renderEnv(); return true }
    }
    return false
  }

  // Footer
  el.querySelector('.sheet-foot').addEventListener('click', e => {
    const r = e.target.closest('[data-role]')?.dataset.role
    if (r === 'cancel') dismissSheet(s)
    if (r === 'save') {
      commitEdit()
      d.env = d.env.filter(v => v.key)
      const i = state.accounts.findIndex(x => x.id === d.id)
      if (i >= 0) state.accounts[i] = d; else state.accounts.push(d)
      dismissSheet(s); renderAll()
    }
    if (r === 'delete') confirmDelete(d.id, () => dismissSheet(s))
    if (r === 'signout') confirmSignOut(() => dismissSheet(s))
  })

  render()
  if (isNew) setTimeout(() => body.querySelector('[data-f="name"]').focus(), 60)
}

/* ---------- Alerts ---------- */
function showAlert({ icon, title, message, confirm, destructive, onConfirm }) {
  const s = presentSheet(`${icon}<div class="t">${title}</div><div class="m">${message}</div>
    <div class="btns"><button class="btn default" data-role="cancel">Cancel</button>
    <button class="btn${destructive ? ' destructive' : ''}" data-role="ok">${confirm}</button></div>`, { cls: 'alert' })
  s.el.addEventListener('click', e => {
    const r = e.target.closest('[data-role]')?.dataset.role
    if (r === 'cancel') dismissSheet(s)
    if (r === 'ok') { dismissSheet(s); onConfirm() }
  })
}
function confirmDelete(id, then) {
  const a = state.accounts.find(x => x.id === id)
  showAlert({
    icon: APP_ICON,
    title: `Delete “${esc(a.name)}”?`,
    message: 'Its token is removed from your keychain. Sessions already running keep going until they end.',
    confirm: 'Delete', destructive: true,
    onConfirm: () => {
      then?.()
      state.accounts = state.accounts.filter(x => x.id !== id)
      renderAll()
    },
  })
}
function confirmSignOut(then) {
  const a = subscription()
  showAlert({
    icon: APP_ICON,
    title: `Sign out of ${esc(a.email)}?`,
    message: 'New sessions can’t use your subscription until you sign in again. Your API providers aren’t affected.',
    confirm: 'Sign Out', destructive: true,
    onConfirm: () => {
      then?.()
      state.accounts = state.accounts.filter(x => x.kind !== 'subscription')
      state.signedOut = a
      renderAll()
    },
  })
}

/* ---------- Sign in ---------- */
function signIn() {
  const s = presentSheet(`
    ${MARK}
    <div class="t">Sign in to Claude</div>
    <div class="m">Continue in your browser. CCTerm finishes signing in when you approve access.</div>
    <div class="wait">${G.spinner}Waiting for your browser…</div>
    <div class="btns"><button class="link" data-role="again">Open Browser Again</button><button class="btn" data-role="cancel">Cancel</button></div>`, { cls: 'signin' })
  const done = setTimeout(() => {
    if (!sheets.includes(s)) return
    const a = state.signedOut || { id: 'sub', kind: 'subscription', name: 'Claude Max', plan: 'Max', email: 'name@example.com', org: 'Personal', method: 'Claude.ai',command: '', args: '', env: [] }
    state.accounts.unshift(a)
    dismissSheet(s); renderAll()
  }, 2600)
  s.el.addEventListener('click', e => {
    const r = e.target.closest('[data-role]')?.dataset.role
    if (r === 'cancel') { clearTimeout(done); dismissSheet(s) }
  })
}

/* ---------- Theme (review control) ---------- */
$('#theme').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  for (const x of $('#theme').children) x.setAttribute('aria-pressed', x === b)
  if (b.dataset.v === 'auto') document.documentElement.removeAttribute('data-theme')
  else document.documentElement.dataset.theme = b.dataset.v
})

// Review helper: a provider alias in the shape people keep in ~/.zshrc.
const SAMPLE_ALIAS = `alias relay="CLAUDE_CODE_ATTRIBUTION_HEADER=0 ENABLE_TOOL_SEARCH=false ANTHROPIC_BASE_URL=https://relay.example.com ANTHROPIC_AUTH_TOKEN=sk-relay-example-0000a1b2 API_TIMEOUT_MS=3000000 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 ANTHROPIC_MODEL=claude-opus-5-5[1m] CLAUDE_CODE_EFFORT_LEVEL=xhigh ANTHROPIC_DEFAULT_SONNET_MODEL=claude-sonnet-5-5 ANTHROPIC_DEFAULT_HAIKU_MODEL=claude-haiku-4-5 claude --permission-mode auto"`
$('#copy-alias').onclick = async e => {
  const b = e.currentTarget
  try { await navigator.clipboard.writeText(SAMPLE_ALIAS) } catch {
    const t = Object.assign(document.createElement('textarea'), { value: SAMPLE_ALIAS }); document.body.append(t); t.select(); document.execCommand('copy'); t.remove()
  }
  b.textContent = 'Copied — paste into a variable list'
  setTimeout(() => { b.textContent = 'Copy Sample Alias' }, 2400)
}

function renderAll() { renderNav(); renderGeneral(); renderAccounts() }
renderAll()
</script>
</body>
